
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>बस वाला — ट्रक ड्राइवर की प्लेलिस्ट</title>
<meta name="description" content="Bus Wala — Truck driver ki playlist. Highway ke gaane, dhaba vibes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Danglers / jhalar fringe hanging like a truck windshield -->
<div class="jhalar" aria-hidden="true">
  <div class="jhalar-string"></div>
  <div class="jhalar-string"></div>
  <div class="jhalar-string"></div>
  <div class="jhalar-string"></div>
  <div class="jhalar-string"></div>
  <div class="jhalar-string"></div>
  <div class="jhalar-string"></div>
</div>

<main class="highway" id="highwayScreen">

  <!-- Top status row -->
  <header class="status-row">
    <span class="clock" id="clock">--:--</span>
    <span class="live-badge"><span class="dot"></span><span id="listenerCount">812</span> highway par</span>
    <button class="playlist-toggle" id="openPlaylist" aria-label="Playlist kholo">☰</button>
  </header>

  <!-- Center title -->
  <section class="title-block">
    <p class="eyebrow" id="nowPlayingEyebrow">अभी बज रहा है</p>
    <h1 class="song-title" id="songTitleHindi">ट्रक ड्राइवर</h1>
    <p class="song-sub" id="songArtist">लोड हो रहा है…</p>
  </section>

  <!-- Horn button -->
  <button class="horn-btn" id="hornBtn" aria-label="Horn bajao">
    <span class="horn-icon">📣</span>
    <span class="horn-label">हॉर्न ओके प्लीज़</span>
  </button>
  <div class="horn-toast" id="hornToast">भोंपू बज गया 📯</div>

  <!-- Truck silhouette scene -->
  <div class="truck-scene" aria-hidden="true">
    <div class="road-line"></div>
    <svg class="truck-svg" id="truckSvg" viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg">
      <!-- cargo body -->
      <rect x="0" y="30" width="230" height="110" fill="#0e1230" opacity="0.001"></rect>
      <path class="truck-tarp" d="M0,40 C15,25 35,55 50,40 C65,25 85,55 100,40 C115,25 135,55 150,40 C165,25 185,55 200,40 L230,40 L230,140 L0,140 Z"></path>
      <rect x="0" y="55" width="230" height="85" class="truck-body-panel"></rect>
      <rect x="10" y="65" width="205" height="55" rx="4" class="truck-body-slats"></rect>
      <!-- cabin -->
      <path class="truck-cabin" d="M230,60 L245,60 C270,60 300,68 315,90 L320,140 L230,140 Z"></path>
      <rect x="255" y="78" width="30" height="34" rx="3" class="truck-window"></rect>
      <rect x="290" y="82" width="20" height="30" rx="3" class="truck-window"></rect>
      <rect x="235" y="55" width="90" height="10" rx="3" class="truck-roof"></rect>
      <!-- wheels -->
      <circle cx="60" cy="145" r="20" class="wheel"></circle>
      <circle cx="60" cy="145" r="8" class="hub"></circle>
      <circle cx="280" cy="145" r="20" class="wheel"></circle>
      <circle cx="280" cy="145" r="8" class="hub"></circle>
    </svg>
  </div>
</main>

<!-- Playlist bottom sheet -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<section class="playlist-sheet" id="playlistSheet" aria-label="Playlist">
  <div class="sheet-handle"></div>
  <h2 class="sheet-title">🚚 माल की लिस्ट <span class="sheet-count" id="songCount"></span></h2>
  <ul class="song-list" id="songList"></ul>
</section>

<!-- Mini player dock -->
<footer class="dock">
  <div class="dock-progress">
    <div class="dock-progress-fill" id="progressFill"></div>
  </div>
  <div class="dock-main">
    <div class="dock-art" id="dockArt">🚛</div>
    <div class="dock-meta">
      <p class="dock-title" id="dockTitle">Bus Wala</p>
      <p class="dock-artist" id="dockArtist">Play dabao aur chalo</p>
    </div>
    <div class="dock-controls">
      <button id="prevBtn" aria-label="Pichla gaana">⏮</button>
      <button id="playBtn" class="play-main" aria-label="Play/Pause">▶</button>
      <button id="nextBtn" aria-label="Agla gaana">⏭</button>
    </div>
  </div>
</footer>

<div id="yt-player-container" style="position:absolute; width:0; height:0; overflow:hidden;"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>
</body>
</html>
