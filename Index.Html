<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>बस वाला — पुरानी यादों का सफर</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bus-body:#C9932E;
    --bus-body-dark:#A9761E;
    --maroon:#7A2E2E;
    --maroon-dark:#5E2222;
    --cream:#F6E9C9;
    --ink:#2B2118;
    --olive:#4B5A3E;
    --plate-yellow:#F2C230;
    --paper:#FBF4E2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, #E8D7A8 0%, transparent 45%),
      linear-gradient(180deg, #E9DAB0 0%, #DCC98D 40%, #cdb877 100%);
    font-family:'Hind', sans-serif;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{background:var(--maroon); color:var(--cream);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001s !important; animation-iteration-count:1 !important;}
  }

  /* ---------- destination board ---------- */
  .board-wrap{
    background:#161311;
    border-bottom:6px solid var(--plate-yellow);
    padding:10px 0;
    overflow:hidden;
    position:relative;
  }
  .board-track{
    display:flex;
    white-space:nowrap;
    width:max-content;
    animation:scrollBoard 18s linear infinite;
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    letter-spacing:2px;
    font-size:15px;
    color:#F2C230;
    text-shadow:0 0 6px rgba(242,194,48,0.55);
  }
  .board-track span{padding-right:48px;}
  @keyframes scrollBoard{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  /* ---------- header / hero ---------- */
  header{
    text-align:center;
    padding:34px 16px 10px;
  }
  .eyebrow{
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    letter-spacing:4px;
    font-size:12px;
    color:var(--maroon-dark);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1.title{
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:clamp(42px,12vw,68px);
    margin:0;
    line-height:0.95;
    color:var(--maroon);
    text-shadow:2px 2px 0 var(--plate-yellow), 4px 4px 0 rgba(43,33,24,0.25);
    letter-spacing:1px;
  }
  .tagline{
    font-size:15px;
    color:#5a4a30;
    margin-top:10px;
    font-weight:500;
  }

  /* ---------- bus illustration ---------- */
  .bus-stage{
    position:relative;
    max-width:520px;
    margin:22px auto 6px;
    padding:0 18px;
  }
  .road{
    height:14px;
    background:repeating-linear-gradient(90deg, #2B2118 0 22px, transparent 22px 40px);
    background-color:#5b5346;
    border-radius:3px;
    margin-top:-6px;
    box-shadow:0 3px 0 #3d382d;
  }
  svg.bus{
    width:100%;
    height:auto;
    display:block;
    filter:drop-shadow(0 10px 8px rgba(0,0,0,0.28));
  }
  .wheel{ animation:spin 2.4s linear infinite; transform-origin:center; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- playlist stops ---------- */
  main{
    max-width:640px;
    margin:0 auto;
    padding:26px 14px 130px;
  }
  .stop{
    margin-bottom:30px;
  }
  .stop-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .stop-pin{
    width:11px;height:11px;border-radius:50%;
    background:var(--maroon);
    box-shadow:0 0 0 3px rgba(122,46,46,0.18);
    flex-shrink:0;
  }
  .stop-head h2{
    font-family:'Rajdhani',sans-serif;
    font-size:22px;
    font-weight:700;
    margin:0;
    color:var(--ink);
  }
  .stop-head .stop-sub{
    font-size:12px;
    color:#6b5c3f;
    margin-left:auto;
    font-weight:500;
  }

  .ticket{
    --notch:16px;
    background:var(--paper);
    border-radius:10px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    margin-bottom:10px;
    position:relative;
    border:1.5px dashed #b79a5e;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
    box-shadow:0 2px 4px rgba(43,33,24,0.08);
  }
  .ticket:active{ transform:scale(0.985); }
  .ticket:hover{ background:#fffaec; box-shadow:0 4px 10px rgba(43,33,24,0.14); }
  .ticket.playing{
    background:linear-gradient(90deg, #f3e2b0, var(--paper) 60%);
    border-color:var(--maroon);
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    width:var(--notch); height:var(--notch);
    background:#DCC98D;
    border-radius:50%;
    top:50%; transform:translateY(-50%);
  }
  .ticket::before{ left:calc(var(--notch) / -2); }
  .ticket::after{ right:calc(var(--notch) / -2); }

  .play-btn{
    flex-shrink:0;
    width:38px;height:38px;
    border-radius:50%;
    background:var(--maroon);
    color:var(--cream);
    display:flex;align-items:center;justify-content:center;
    border:none;
    font-size:14px;
    cursor:pointer;
  }
  .ticket.playing .play-btn{ background:var(--olive); }

  .song-info{ min-width:0; flex:1; }
  .song-title{
    font-weight:600; font-size:16px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .song-meta{
    font-size:12.5px; color:#7a6a49; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .song-year{
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:13px;
    color:#8a6a2e;
    flex-shrink:0;
    border-left:1px dashed #b79a5e;
    padding-left:10px;
  }

  /* ---------- bottom player ---------- */
  .player{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--maroon);
    color:var(--cream);
    padding:10px 14px 14px;
    box-shadow:0 -6px 16px rgba(0,0,0,0.25);
    border-top:4px solid var(--plate-yellow);
  }
  .player-row{
    display:flex; align-items:center; gap:12px;
  }
  .player-info{ flex:1; min-width:0; }
  .player-title{ font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player-sub{ font-size:11.5px; opacity:0.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player-controls{ display:flex; align-items:center; gap:10px; }
  .ctrl-btn{
    background:none; border:none; color:var(--cream);
    font-size:20px; cursor:pointer; line-height:1;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  }
  .ctrl-btn.main{
    background:var(--plate-yellow); color:var(--maroon-dark);
    border-radius:50%; width:40px; height:40px; font-size:17px;
  }
  .track-road{
    position:relative;
    height:6px;
    background:rgba(246,233,201,0.25);
    border-radius:3px;
    margin-top:10px;
    overflow:visible;
  }
  .track-fill{
    position:absolute; left:0; top:0; bottom:0;
    background:var(--plate-yellow);
    border-radius:3px;
    width:0%;
    transition:width .25s linear;
  }
  .track-bus{
    position:absolute; top:-9px;
    transform:translateX(-50%);
    font-size:16px;
    left:0%;
    transition:left .25s linear;
  }
  .hint{
    text-align:center;
    font-size:11px;
    color:#8a7a54;
    margin-top:22px;
    line-height:1.6;
  }
  footer{
    text-align:center;
    font-family:'Rajdhani',sans-serif;
    font-size:12px;
    letter-spacing:2px;
    color:#7a6a49;
    padding-bottom:14px;
  }
</style>
</head>
<body>

<div class="board-wrap">
  <div class="board-track" id="board">
    <span>🚌 बस वाला — नेक्स्ट स्टॉप: पुरानी यादें</span>
    <span>🚌 बस वाला — नेक्स्ट स्टॉप: पुरानी यादें</span>
  </div>
</div>

<header>
  <div class="eyebrow">पुरानी यादों की बस</div>
  <h1 class="title">बस वाला</h1>
  <div class="tagline">वही गाने, वही सफर — जो हर बस वाला सुनाता है</div>
</header>

<div class="bus-stage">
  <svg class="bus" viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg">
    <!-- body -->
    <rect x="18" y="35" width="330" height="80" rx="14" fill="var(--bus-body)"/>
    <rect x="18" y="35" width="330" height="80" rx="14" fill="none" stroke="var(--bus-body-dark)" stroke-width="3"/>
    <!-- maroon stripe -->
    <rect x="18" y="88" width="330" height="14" fill="var(--maroon)"/>
    <rect x="18" y="88" width="330" height="4" fill="var(--plate-yellow)"/>
    <!-- roof -->
    <rect x="30" y="22" width="300" height="18" rx="9" fill="var(--bus-body-dark)"/>
    <!-- windows -->
    <rect x="34" y="44" width="52" height="34" rx="6" fill="#BFE3E8" stroke="#2B2118" stroke-width="2"/>
    <rect x="94" y="44" width="52" height="34" rx="6" fill="#BFE3E8" stroke="#2B2118" stroke-width="2"/>
    <rect x="154" y="44" width="52" height="34" rx="6" fill="#9fd0d6" stroke="#2B2118" stroke-width="2"/>
    <rect x="214" y="44" width="52" height="34" rx="6" fill="#BFE3E8" stroke="#2B2118" stroke-width="2"/>
    <!-- destination board on bus -->
    <rect x="278" y="44" width="60" height="22" rx="3" fill="#161311"/>
    <text x="308" y="59" text-anchor="middle" font-family="Rajdhani, sans-serif" font-weight="700" font-size="11" fill="#F2C230">बस वाला</text>
    <!-- door -->
    <rect x="278" y="70" width="30" height="42" rx="3" fill="#8a6a2e" stroke="#2B2118" stroke-width="2"/>
    <line x1="293" y1="70" x2="293" y2="112" stroke="#2B2118" stroke-width="1.5"/>
    <!-- front decoration eyes (typical Indian truck/bus art) -->
    <circle cx="352" cy="60" r="5" fill="#F6E9C9" stroke="#2B2118" stroke-width="1.5"/>
    <circle cx="352" cy="80" r="5" fill="#F6E9C9" stroke="#2B2118" stroke-width="1.5"/>
    <!-- number plate -->
    <rect x="150" y="104" width="70" height="16" rx="2" fill="var(--plate-yellow)" stroke="#2B2118" stroke-width="1.5"/>
    <text x="185" y="116" text-anchor="middle" font-family="Rajdhani, sans-serif" font-weight="700" font-size="10" fill="#2B2118">UP 32 BV 786</text>
    <!-- wheels -->
    <g class="wheel" style="transform-box: fill-box;">
      <circle cx="80" cy="120" r="20" fill="#2B2118"/>
      <circle cx="80" cy="120" r="9" fill="#cfcabf"/>
      <circle cx="80" cy="120" r="3" fill="#2B2118"/>
    </g>
    <g class="wheel" style="transform-box: fill-box;">
      <circle cx="280" cy="120" r="20" fill="#2B2118"/>
      <circle cx="280" cy="120" r="9" fill="#cfcabf"/>
      <circle cx="280" cy="120" r="3" fill="#2B2118"/>
    </g>
  </svg>
  <div class="road"></div>
</div>

<main id="playlists"></main>

<div class="player" id="player">
  <div class="player-row">
    <div class="player-info">
      <div class="player-title" id="pTitle">गाना चुनिए ऊपर की लिस्ट से</div>
      <div class="player-sub" id="pSub">बस वाला की प्लेलिस्ट</div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" id="prevBtn" aria-label="पिछला गाना">⏮</button>
      <button class="ctrl-btn main" id="playPauseBtn" aria-label="चलाएं / रोकें">▶</button>
      <button class="ctrl-btn" id="nextBtn" aria-label="अगला गाना">⏭</button>
    </div>
  </div>
  <div class="track-road">
    <div class="track-fill" id="trackFill"></div>
    <div class="track-bus" id="trackBus" style="left:0%;">🚌</div>
  </div>
</div>

<script>
const PLAYLISTS = [
  {
    name: "सफर के गाने",
    sub: "खिड़की वाली सीट",
    songs: [
      {title:"चलते चलते", movie:"पाकीज़ा", singer:"लता मंगेशकर", year:"1972", src:""},
      {title:"गाड़ी बुला रही है", movie:"दोस्त", singer:"किशोर कुमार", year:"1974", src:""},
      {title:"ये शाम मस्तानी", movie:"कटी पतंग", singer:"किशोर कुमार", year:"1970", src:""},
      {title:"आने वाला पल", movie:"गोल माल", singer:"किशोर कुमार", year:"1979", src:""},
    ]
  },
  {
    name: "दोस्ती के रंग",
    sub: "साथ वाली सीट",
    songs: [
      {title:"ये दोस्ती", movie:"शोले", singer:"किशोर कुमार, मन्ना डे", year:"1975", src:""},
      {title:"एक अजनबी हसीना से", movie:"अजनबी", singer:"किशोर कुमार", year:"1974", src:""},
    ]
  },
  {
    name: "पुराना प्यार",
    sub: "पीछे वाली सीट",
    songs: [
      {title:"मेरे सपनों की रानी", movie:"आराधना", singer:"किशोर कुमार", year:"1969", src:""},
      {title:"रूप तेरा मस्ताना", movie:"आराधना", singer:"किशोर कुमार", year:"1969", src:""},
      {title:"बिंदिया चमकेगी", movie:"दो रास्ते", singer:"लता मंगेशकर, रफ़ी", year:"1969", src:""},
      {title:"ओ मेरे दिल के चैन", movie:"मेरे जीवन साथी", singer:"किशोर कुमार", year:"1972", src:""},
    ]
  },
  {
    name: "मस्ती भरे गाने",
    sub: "ड्राइवर की पसंद",
    songs: [
      {title:"चुरा लिया है तुमने", movie:"यादों की बारात", singer:"आशा भोंसले, रफ़ी", year:"1973", src:""},
      {title:"दिलबर दिल से प्यारे", movie:"कारवां", singer:"आशा भोंसले, आर.डी. बर्मन", year:"1971", src:""},
      {title:"पल पल दिल के पास", movie:"ब्लैकमेल", singer:"किशोर कुमार", year:"1973", src:""},
    ]
  }
];

const main = document.getElementById('playlists');
let flatSongs = [];

PLAYLISTS.forEach((stop) => {
  const section = document.createElement('section');
  section.className = 'stop';

  const head = document.createElement('div');
  head.className = 'stop-head';
  head.innerHTML = `<span class="stop-pin"></span><h2>${stop.name}</h2><span class="stop-sub">${stop.sub}</span>`;
  section.appendChild(head);

  stop.songs.forEach((song) => {
    const idx = flatSongs.length;
    flatSongs.push(song);

    const el = document.createElement('div');
    el.className = 'ticket';
    el.dataset.index = idx;
    el.innerHTML = `
      <button class="play-btn" aria-label="चलाएं">▶</button>
      <div class="song-info">
        <div class="song-title">${song.title}</div>
        <div class="song-meta">${song.movie} · ${song.singer}</div>
      </div>
      <div class="song-year">${song.year}</div>
    `;
    el.addEventListener('click', () => playSong(idx));
    section.appendChild(el);
  });

  main.appendChild(section);
});

const hint = document.createElement('div');
hint.className = 'hint';
hint.innerHTML = "🎧 ये गाने कॉपीराइट की वजह से अभी असली MP3 से नहीं जुड़े हैं।<br>कोड में हर song के <code>src</code> field में अपनी audio file का link डालकर इसे पूरा चालू कर सकते हैं।";
main.appendChild(hint);

const foot = document.createElement('footer');
foot.textContent = "बस वाला · हर सफर एक गाना";
main.appendChild(foot);

// ---- player logic ----
const audio = new Audio();
let currentIndex = -1;
let isPlaying = false;
let fakeProgress = 0;
let fakeTimer = null;

const pTitle = document.getElementById('pTitle');
const pSub = document.getElementById('pSub');
const playPauseBtn = document.getElementById('playPauseBtn');
const trackFill = document.getElementById('trackFill');
const trackBus = document.getElementById('trackBus');

function renderActiveTicket(){
  document.querySelectorAll('.ticket').forEach(t=>{
    const active = Number(t.dataset.index) === currentIndex;
    t.classList.toggle('playing', active && isPlaying);
    t.querySelector('.play-btn').textContent = (active && isPlaying) ? '❚❚' : '▶';
  });
}

function setProgress(pct){
  trackFill.style.width = pct + '%';
  trackBus.style.left = pct + '%';
}

function stopFakeProgress(){
  if(fakeTimer){ clearInterval(fakeTimer); fakeTimer = null; }
}

function startFakeProgress(){
  stopFakeProgress();
  fakeTimer = setInterval(()=>{
    fakeProgress += 0.6;
    if(fakeProgress >= 100){
      fakeProgress = 0;
      nextSong();
      return;
    }
    setProgress(fakeProgress);
  }, 300);
}

function playSong(idx){
  currentIndex = (idx + flatSongs.length) % flatSongs.length;
  const song = flatSongs[currentIndex];
  pTitle.textContent = song.title;
  pSub.textContent = `${song.movie} · ${song.singer} · ${song.year}`;
  fakeProgress = 0;
  setProgress(0);

  if(song.src){
    audio.src = song.src;
    audio.play().catch(()=>{});
  } else {
    audio.pause();
    audio.removeAttribute('src');
  }
  isPlaying = true;
  playPauseBtn.textContent = '❚❚';
  startFakeProgress();
  renderActiveTicket();
}

function togglePlayPause(){
  if(currentIndex === -1){ playSong(0); return; }
  isPlaying = !isPlaying;
  if(isPlaying){
    if(audio.src) audio.play().catch(()=>{});
    startFakeProgress();
    playPauseBtn.textContent = '❚❚';
  } else {
    audio.pause();
    stopFakeProgress();
    playPauseBtn.textContent = '▶';
  }
  renderActiveTicket();
}

function nextSong(){ playSong((currentIndex === -1 ? 0 : currentIndex) + 1); }
function prevSong(){ playSong((currentIndex === -1 ? 0 : currentIndex) - 1); }

playPauseBtn.addEventListener('click', togglePlayPause);
document.getElementById('nextBtn').addEventListener('click', nextSong);
document.getElementById('prevBtn').addEventListener('click', prevSong);
</script>

</body>
</html>
