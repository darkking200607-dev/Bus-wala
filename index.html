<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>बस वाला</title>
  <meta
    name="description"
    content="बस वाला — music, safar aur yaadein."
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="app">

    <!-- Cinematic Background -->
    <div class="background"></div>
    <div class="dark-overlay"></div>

    <!-- Top -->
    <header class="top-bar">

      <div class="online-status">
        <span class="online-dot"></span>
        <span id="onlineCount">0</span>
        <span>on the highway</span>
      </div>

      <button
        class="horn-button"
        id="hornButton"
        aria-label="Horn"
      >
        ◉
      </button>

    </header>

    <!-- Main Title -->
    <section class="hero">
      <h1>बस वाला</h1>
    </section>

    <!-- Bottom Music -->
    <section class="music-area">

      <p class="quote" id="quote">
        बुरी नज़र वाले तेरा भी भला हो
      </p>

      <div class="player">

        <div class="song-info">

          <div class="cover" id="cover">
            <span>♪</span>
          </div>

          <div class="song-details">
            <h2 id="songTitle">बस वाला</h2>
            <p id="artistName">Playlist loading...</p>
          </div>

        </div>

        <div class="player-controls">

          <button
            id="previousButton"
            aria-label="Previous song"
          >
            ⏮
          </button>

          <button
            class="play-button"
            id="playButton"
            aria-label="Play"
          >
            ▶
          </button>

          <button
            id="nextButton"
            aria-label="Next song"
          >
            ⏭
          </button>

        </div>

        <div class="progress-container">

          <span id="currentTime">0:00</span>

          <div
            class="progress-bar"
            id="progressBar"
          >
            <div
              class="progress"
              id="progress"
            ></div>
          </div>

          <span id="duration">0:00</span>

        </div>

      </div>

    </section>

  </main>

  <!-- Music -->
  <audio
    id="audio"
    preload="metadata"
  ></audio>

  <!-- Horn -->
  <audio
    id="hornAudio"
    preload="auto"
  >
    <source
      src="assets/horn.mp3"
      type="audio/mpeg"
    />
  </audio>

  <script src="app.js"></script>

</body>
</html>
