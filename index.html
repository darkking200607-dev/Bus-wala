<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>बस वाला</title>
  <meta
    name="description"
    content="बस वाला — music on the highway."
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="app">

    <!-- Background -->
    <div class="background"></div>
    <div class="dark-overlay"></div>

    <!-- Top status -->
    <div class="top-bar">
      <div class="online-status">
        <span class="online-dot"></span>
        <span id="onlineCount">0</span>
        <span>on the highway</span>
      </div>

      <button class="sound-button" id="soundButton" aria-label="Sound">
        ◉
      </button>
    </div>

    <!-- Main title -->
    <section class="hero">
      <h1>बस वाला</h1>
    </section>

    <!-- Bottom music area -->
    <section class="music-area">

      <p class="quote" id="quote">
        सफ़र अच्छा हो तो रास्ते याद रहते हैं
      </p>

      <div class="player">

        <div class="song-info">
          <div class="cover" id="cover">
            <span>♪</span>
          </div>

          <div class="song-details">
            <h2 id="songTitle">बस वाला</h2>
            <p id="artistName">Loading playlist...</p>
          </div>
        </div>

        <div class="player-controls">

          <button id="shuffleButton" aria-label="Shuffle">
            ⤨
          </button>

          <button id="previousButton" aria-label="Previous">
            ⏮
          </button>

          <button class="play-button" id="playButton" aria-label="Play">
            ▶
          </button>

          <button id="nextButton" aria-label="Next">
            ⏭
          </button>

          <button id="playlistButton" aria-label="Playlist">
            ☷
          </button>

        </div>

        <div class="progress-container">
          <span id="currentTime">0:00</span>

          <div class="progress-bar">
            <div class="progress" id="progress"></div>
          </div>

          <span id="duration">0:00</span>
        </div>

      </div>

    </section>

  </main>

  <audio id="audio"></audio>

  <script src="app.js"></script>

</body>
</html>
