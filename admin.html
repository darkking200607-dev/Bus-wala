<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bus Wala — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101313;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .sub {
      color: #999;
      margin-bottom: 25px;
    }

    .card {
      background: #1b1f1f;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      margin-top: 10px;
      font-size: 15px;
    }

    input {
      background: #111;
      color: white;
    }

    button {
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button.delete {
      background: #9d2222;
      color: white;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 15px;
      color: #aaa;
      line-height: 1.5;
    }

    .song {
      background: #111;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
    }

    .song-title {
      font-size: 18px;
      font-weight: bold;
    }

    .song-artist {
      color: #aaa;
      margin-top: 5px;
    }

    .logout {
      background: transparent;
      color: #aaa;
      border: 1px solid #444;
    }

    label {
      display: block;
      margin-top: 15px;
      color: #ccc;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginSection" class="card">

    <h1>Bus Wala</h1>
    <div class="sub">Admin Panel</div>

    <input
      id="email"
      type="email"
      placeholder="Admin email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <div id="loginStatus" class="status"></div>

  </div>


  <div id="adminSection" class="hidden">

    <div class="card">

      <h1>🎵 Add Song</h1>
      <div class="sub">
        Add a new song to Bus Wala
      </div>

      <label>Song Title</label>
      <input
        id="songTitle"
        type="text"
        placeholder="Example: Raat Ka Safar"
      >

      <label>Artist</label>
      <input
        id="artist"
        type="text"
        placeholder="Artist name"
      >

      <label>Shayari</label>
      <input
        id="quote"
        type="text"
        placeholder="Safar mein mile log aksar yaad reh jaate hain"
      >

      <label>MP3 File</label>
      <input
        id="audioFile"
        type="file"
        accept="audio/mpeg,audio/mp3"
      >

      <label>Cover Image (optional)</label>
      <input
        id="coverFile"
        type="file"
        accept="image/*"
      >

      <button onclick="addSong()">
        Add Song
      </button>

      <div id="uploadStatus" class="status"></div>

    </div>


    <div class="card">

      <h1>🎧 Songs</h1>

      <div id="songsList">
        Loading...
      </div>

    </div>


    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>


<script>

  /* ==============================
     SUPABASE CONFIG
     ============================== */

  const SUPABASE_URL =
    
   https://syfkofzuygokifhibtro.supabase.co
    

  const SUPABASE_KEY =
    
    sb_publishable_CZSigqxv0PjlPFRE4-_lsA_I3wLMqEn
    


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==============================
     LOGIN
     ============================== */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const status =
      document.getElementById("loginStatus");

    if (!email || !password) {

      status.textContent =
        "Email aur password enter karo.";

      return;
    }

    status.textContent =
      "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      status.textContent =
        "Login failed: " + error.message;

      return;
    }

    showAdmin();

  }


  /* ==============================
     SHOW ADMIN
     ============================== */

  function showAdmin() {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("adminSection")
      .classList.remove("hidden");

    loadSongs();

  }


  /* ==============================
     LOGOUT
     ============================== */

  async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

  }


  /* ==============================
     ADD SONG
     ============================== */

  async function addSong() {

    const title =
      document.getElementById("songTitle").value.trim();

    const artist =
      document.getElementById("artist").value.trim();

    const quote =
      document.getElementById("quote").value.trim();

    const audioFile =
      document.getElementById("audioFile").files[0];

    const coverFile =
      document.getElementById("coverFile").files[0];

    const status =
      document.getElementById("uploadStatus");


    if (!title) {

      status.textContent =
        "Song title daalo.";

      return;
    }


    if (!audioFile) {

      status.textContent =
        "MP3 file select karo.";

      return;
    }


    status.textContent =
      "Uploading song...";


    try {

      /* AUDIO */

      const audioName =
        Date.now() + "-" +
        audioFile.name.replace(/\s+/g, "-");


      const audioPath =
        "audio/" + audioName;


      const { error: audioError } =
        await supabaseClient.storage
          .from("songs")
          .upload(
            audioPath,
            audioFile,
            {
              contentType: audioFile.type ||
                "audio/mpeg",
              upsert: false
            }
          );


      if (audioError)
        throw audioError;


      const { data: audioData } =
        supabaseClient.storage
          .from("songs")
          .getPublicUrl(audioPath);


      const audioUrl =
        audioData.publicUrl;


      /* COVER */

      let coverUrl = null;


      if (coverFile) {

        const coverName =
          Date.now() + "-" +
          coverFile.name.replace(/\s+/g, "-");


        const coverPath =
          "covers/" + coverName;


        const { error: coverError } =
          await supabaseClient.storage
            .from("songs")
            .upload(
              coverPath,
              coverFile,
              {
                contentType: coverFile.type,
                upsert: false
              }
            );


        if (coverError)
          throw coverError;


        const { data: coverData } =
          supabaseClient.storage
            .from("songs")
            .getPublicUrl(coverPath);


        coverUrl =
          coverData.publicUrl;

      }


      /* DATABASE */

      const { error: dbError } =
        await supabaseClient
          .from("songs")
          .insert({
            title: title,
            artist: artist || "Bus Wala",
            audio_url: audioUrl,
            cover_url: coverUrl,
            quote: quote || ""
          });


      if (dbError)
        throw dbError;


      status.textContent =
        "✅ Song successfully added!";


      document
        .getElementById("songTitle")
        .value = "";

      document
        .getElementById("artist")
        .value = "";

      document
        .getElementById("quote")
        .value = "";

      document
        .getElementById("audioFile")
        .value = "";

      document
        .getElementById("coverFile")
        .value = "";


      loadSongs();

    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ Error: " + error.message;

    }

  }


  /* ==============================
     LOAD SONGS
     ============================== */

  async function loadSongs() {

    const list =
      document.getElementById("songsList");

    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order(
          "created_at",
          { ascending: false }
        );


    if (error) {

      list.innerHTML =
        "Error loading songs.";

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        "Abhi koi song nahi hai.";

      return;
    }


    list.innerHTML = "";


    data.forEach(song => {

      const div =
        document.createElement("div");

      div.className =
        "song";


      div.innerHTML = `

        <div class="song-title">
          ${escapeHtml(song.title)}
        </div>

        <div class="song-artist">
          ${escapeHtml(song.artist || "")}
        </div>

        <button
          class="delete"
          onclick="deleteSong('${song.id}')"
        >
          Delete
        </button>

      `;


      list.appendChild(div);

    });

  }


  /* ==============================
     DELETE SONG
     ============================== */

  async function deleteSong(id) {

    if (!confirm("Ye song delete karna hai?"))
      return;


    const { error } =
      await supabaseClient
        .from("songs")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Delete failed: " +
        error.message
      );

      return;
    }


    loadSongs();

  }


  /* ==============================
     SECURITY
     ============================== */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text || "";

    return div.innerHTML;

  }


  /* ==============================
     CHECK SESSION
     ============================== */

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();


    if (data.session) {

      showAdmin();

    }

  }


  checkSession();

</script>

</body>
</html>
