<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bus Wala — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101313;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    h1 {
      margin: 0 0 8px;
    }

    .sub {
      color: #999;
      margin-bottom: 25px;
    }

    .card {
      background: #1b1f1f;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 15px;
    }

    input {
      background: #111;
      color: white;
      border: 1px solid #444;
    }

    button {
      background: white;
      color: black;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .delete {
      background: #9d2222;
      color: white;
    }

    .logout {
      background: transparent;
      color: #aaa;
      border: 1px solid #444;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 15px;
      color: #aaa;
      line-height: 1.5;
      word-break: break-word;
    }

    label {
      display: block;
      margin-top: 15px;
      color: #ccc;
      font-size: 14px;
    }

    .song {
      background: #111;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
    }

    .song-title {
      font-size: 18px;
      font-weight: bold;
    }

    .song-artist {
      color: #999;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="loginSection" class="card">

    <h1>🚌 Bus Wala</h1>

    <div class="sub">
      Admin Panel
    </div>

    <input
      id="email"
      type="email"
      placeholder="Admin email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      type="button"
    >
      Login
    </button>

    <div
      id="loginStatus"
      class="status"
    ></div>

  </div>


  <!-- ADMIN -->

  <div
    id="adminSection"
    class="hidden"
  >

    <div class="card">

      <h1>🎵 Add Song</h1>

      <div class="sub">
        Add a new song to Bus Wala
      </div>


      <label>Song Title</label>

      <input
        id="songTitle"
        type="text"
        placeholder="Example: Raat Ka Safar"
      >


      <label>Artist</label>

      <input
        id="artist"
        type="text"
        placeholder="Artist name"
      >


      <label>Shayari</label>

      <input
        id="quote"
        type="text"
        placeholder="Safar mein mile log aksar yaad reh jaate hain"
      >


      <label>MP3 File</label>

      <input
        id="audioFile"
        type="file"
        accept="audio/mpeg,audio/mp3,audio/*"
      >


      <label>Cover Image — optional</label>

      <input
        id="coverFile"
        type="file"
        accept="image/*"
      >


      <button
        id="addSongButton"
        type="button"
      >
        Add Song
      </button>


      <div
        id="uploadStatus"
        class="status"
      ></div>

    </div>


    <!-- SONG LIST -->

    <div class="card">

      <h1>🎧 Songs</h1>

      <div id="songsList">
        Loading...
      </div>

    </div>


    <button
      id="logoutButton"
      class="logout"
      type="button"
    >
      Logout
    </button>

  </div>

</div>


<script>

/* =================================
   SUPABASE CONFIG
================================= */

const SUPABASE_URL =
  "https://syfkofzuygokifhibtro.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_CZSigqxv0PjlPFRE4-_lsA_I3wLMqEn";


/* =================================
   CREATE CLIENT
================================= */

let supabaseClient;


try {

  if (
    !SUPABASE_URL ||
    !SUPABASE_KEY ||
    SUPABASE_KEY === "YOUR_PUBLISHABLE_KEY"
  ) {
    throw new Error(
      "Supabase URL ya Publishable Key missing hai."
    );
  }


  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

} catch (error) {

  document.getElementById(
    "loginStatus"
  ).textContent =
    "Configuration error: " +
    error.message;

}


/* =================================
   ELEMENTS
================================= */

const loginSection =
  document.getElementById(
    "loginSection"
  );

const adminSection =
  document.getElementById(
    "adminSection"
  );

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById(
    "loginButton"
  );

const loginStatus =
  document.getElementById(
    "loginStatus"
  );

const addSongButton =
  document.getElementById(
    "addSongButton"
  );

const uploadStatus =
  document.getElementById(
    "uploadStatus"
  );

const songsList =
  document.getElementById(
    "songsList"
  );

const logoutButton =
  document.getElementById(
    "logoutButton"
  );


/* =================================
   LOGIN
================================= */

async function login() {

  if (!supabaseClient) {

    loginStatus.textContent =
      "Supabase configuration missing.";

    return;

  }


  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if (!email || !password) {

    loginStatus.textContent =
      "Email aur password enter karo.";

    return;

  }


  loginButton.disabled = true;

  loginStatus.textContent =
    "Logging in...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({
          email: email,
          password: password
        });


    if (error) {
      throw error;
    }


    loginStatus.textContent =
      "Login successful.";


    showAdmin();


  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );


    loginStatus.textContent =
      "❌ Login failed: " +
      error.message;

  }


  loginButton.disabled = false;

}


/* =================================
   SHOW ADMIN
================================= */

function showAdmin() {

  loginSection.classList.add(
    "hidden"
  );

  adminSection.classList.remove(
    "hidden"
  );

  loadSongs();

}


/* =================================
   LOGOUT
================================= */

async function logout() {

  if (!supabaseClient) return;

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =================================
   ADD SONG
================================= */

async function addSong() {

  const title =
    document.getElementById(
      "songTitle"
    ).value.trim();

  const artist =
    document.getElementById(
      "artist"
    ).value.trim();

  const quote =
    document.getElementById(
      "quote"
    ).value.trim();

  const audioFile =
    document.getElementById(
      "audioFile"
    ).files[0];

  const coverFile =
    document.getElementById(
      "coverFile"
    ).files[0];


  if (!title) {

    uploadStatus.textContent =
      "Song title daalo.";

    return;

  }


  if (!audioFile) {

    uploadStatus.textContent =
      "MP3 file select karo.";

    return;

  }


  addSongButton.disabled = true;

  uploadStatus.textContent =
    "Uploading song...";


  try {

    /* =============================
       AUDIO
    ============================= */

    const safeName =
      audioFile.name
        .replace(/[^a-zA-Z0-9._-]/g, "-");


    const audioPath =
      "audio/" +
      Date.now() +
      "-" +
      safeName;


    const {
      error: audioError
    } =
      await supabaseClient.storage
        .from("songs")
        .upload(
          audioPath,
          audioFile,
          {
            contentType:
              audioFile.type ||
              "audio/mpeg",
            upsert: false
          }
        );


    if (audioError) {
      throw audioError;
    }


    const {
      data: audioData
    } =
      supabaseClient.storage
        .from("songs")
        .getPublicUrl(
          audioPath
        );


    const audioUrl =
      audioData.publicUrl;


    /* =============================
       COVER
    ============================= */

    let coverUrl = null;


    if (coverFile) {

      const safeCoverName =
        coverFile.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "-"
          );


      const coverPath =
        "covers/" +
        Date.now() +
        "-" +
        safeCoverName;


      const {
        error: coverError
      } =
        await supabaseClient.storage
          .from("songs")
          .upload(
            coverPath,
            coverFile,
            {
              contentType:
                coverFile.type,
              upsert: false
            }
          );


      if (coverError) {
        throw coverError;
      }


      const {
        data: coverData
      } =
        supabaseClient.storage
          .from("songs")
          .getPublicUrl(
            coverPath
          );


      coverUrl =
        coverData.publicUrl;

    }


    /* =============================
       DATABASE
    ============================= */

    const {
      error: databaseError
    } =
      await supabaseClient
        .from("songs")
        .insert({

          title: title,

          artist:
            artist ||
            "Bus Wala",

          audio_url:
            audioUrl,

          cover_url:
            coverUrl,

          quote:
            quote || ""

        });


    if (databaseError) {
      throw databaseError;
    }


    uploadStatus.textContent =
      "✅ Song successfully added!";


    document.getElementById(
      "songTitle"
    ).value = "";

    document.getElementById(
      "artist"
    ).value = "";

    document.getElementById(
      "quote"
    ).value = "";

    document.getElementById(
      "audioFile"
    ).value = "";

    document.getElementById(
      "coverFile"
    ).value = "";


    loadSongs();


  } catch (error) {

    console.error(
      "UPLOAD ERROR:",
      error
    );


    uploadStatus.textContent =
      "❌ Upload failed: " +
      error.message;

  }


  addSongButton.disabled = false;

}


/* =================================
   LOAD SONGS
================================= */

async function loadSongs() {

  if (!supabaseClient) return;


  songsList.textContent =
    "Loading...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {
      throw error;
    }


    if (!data || data.length === 0) {

      songsList.textContent =
        "Abhi koi song nahi hai.";

      return;

    }


    songsList.innerHTML = "";


    data.forEach(song => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "song";


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "song-title";

      title.textContent =
        song.title;


      const artist =
        document.createElement(
          "div"
        );

      artist.className =
        "song-artist";

      artist.textContent =
        song.artist ||
        "Bus Wala";


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "delete";

      deleteButton.textContent =
        "Delete";

      deleteButton.onclick =
        () => deleteSong(song.id);


      div.appendChild(title);

      div.appendChild(artist);

      div.appendChild(
        deleteButton
      );

      songsList.appendChild(div);

    });


  } catch (error) {

    console.error(
      "LOAD ERROR:",
      error
    );

    songsList.textContent =
      "Error: " +
      error.message;

  }

}


/* =================================
   DELETE SONG
================================= */

async function deleteSong(id) {

  const confirmed =
    confirm(
      "Ye song delete karna hai?"
    );


  if (!confirmed) return;


  try {

    const {
      error
    } =
      await supabaseClient
        .from("songs")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {
      throw error;
    }


    loadSongs();


  } catch (error) {

    alert(
      "Delete failed: " +
      error.message
    );

  }

}


/* =================================
   CHECK SESSION
================================= */

async function checkSession() {

  if (!supabaseClient) return;


  try {

    const {
      data
    } =
      await supabaseClient.auth
        .getSession();


    if (
      data &&
      data.session
    ) {

      showAdmin();

    }

  } catch (error) {

    console.error(error);

  }

}


/* =================================
   EVENTS
================================= */

loginButton.addEventListener(
  "click",
  login
);

logoutButton.addEventListener(
  "click",
  logout
);

addSongButton.addEventListener(
  "click",
  addSong
);


/* =================================
   START
================================= */

checkSession();

</script>

</body>
</html>
